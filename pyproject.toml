# PRISMA Citation & Corpus Audit Toolkit

Deterministic Python CLI and library for auditing **PRISMA 2020** and **SWiM** engineering systematic reviews against citation drift, full-text version mismatches, and strict journal word-budget limits.

## Key Capabilities
- **Bidirectional Citation Sequencing:** Parses OpenXML (`.docx`) manuscripts across body prose, captions, footnotes, and table cells to certify strict sequential first-appearance reference ordering with zero orphan entries or range gaps.
- **Cryptographic Corpus Provenance:** Validates local full-text PDF repositories against master SHA-256 registries so primary articles, supplements, and corrigenda never drift silently.
- **Hardened Archive Inspection:** Enforces path-traversal guards and XML payload ceilings when inspecting external `.docx` archives.

## Quickstart
```bash
python prisma_audit.py docx path/to/manuscript.docx
python prisma_audit.py manifest path/to/corpus_index.csv
