[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-citation-audit-toolkit"
version = "0.1.0"
description = "Deterministic Python utilities for bidirectional citation sequencing, SHA-256 corpus verification, and word-budget auditing in PRISMA systematic reviews."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Abdulaziz Majeed", email = "A.Majeed-2@sms.ed.ac.uk"}]
py-modules = ["prisma_audit"]

[project.scripts]
prisma-audit = "prisma_audit:main"
